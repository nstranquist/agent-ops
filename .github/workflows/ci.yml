name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      # vet + unit tests + the README-command smoke over all seven lanes.
      - name: agent-ops gate
        run: make gate

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no machine-specific paths or private hostnames
        run: make leak-scan
